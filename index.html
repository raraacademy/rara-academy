<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="RARA ACADEMY - AI Learning Hub">
<title>RARA ACADEMY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =====================================================
   COLORS
===================================================== */

:root{
  --bg:#050505;
  --bg2:#090909;
  --card:#111216;
  --card2:#17181d;

  --orange:#ff7a00;
  --orange2:#ff9d2e;

  --white:#fff;
  --muted:#9b9ba3;

  --line:rgba(255,255,255,.09);

  --green:#38d996;
}


/* =====================================================
   GENERAL
===================================================== */

.container{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}


/* =====================================================
   LOADING
===================================================== */

.loading-screen{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#050505;
}

.loader{
  width:42px;
  height:42px;

  border-radius:50%;

  border:3px solid rgba(255,255,255,.10);
  border-top-color:var(--orange);

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

  background:
    radial-gradient(
      circle at 80% 10%,
      rgba(255,122,0,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(255,122,0,.07),
      transparent 30%
    ),
    #050505;
}

.login-box{
  width:100%;
  max-width:430px;

  background:rgba(15,15,18,.97);

  border:1px solid var(--line);

  border-radius:28px;

  padding:34px 28px 28px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.55);
}

.logo-wrap{
  text-align:center;
  margin-bottom:30px;
}

.logo-icon{
  width:78px;
  height:78px;

  margin:0 auto 15px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      #ff9d2e,
      #ff5d00
    );

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 10px 35px rgba(255,122,0,.30);
}

.logo-icon::before{
  content:"R";

  font-size:46px;
  font-weight:900;

  color:#fff;

  font-style:italic;
}

.logo-title{
  font-size:29px;
  font-weight:900;
  letter-spacing:1px;
}

.logo-title span{
  color:var(--orange);
}

.logo-subtitle{
  margin-top:6px;

  color:var(--muted);

  font-size:14px;
}

.login-box h1{
  font-size:25px;
  margin-bottom:8px;
}

.login-description{
  color:var(--muted);

  font-size:14px;
  line-height:1.6;

  margin-bottom:24px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;

  font-size:13px;

  color:#ddd;

  margin-bottom:8px;
}

.input-wrap{
  position:relative;
}

.input-wrap span{
  position:absolute;

  left:15px;
  top:50%;

  transform:translateY(-50%);

  opacity:.7;
}

.form-control{
  width:100%;
  height:52px;

  border-radius:14px;

  border:1px solid var(--line);

  background:#0a0a0d;

  color:#fff;

  padding:0 15px 0 45px;

  outline:none;

  transition:.2s;
}

.form-control:focus{
  border-color:var(--orange);

  box-shadow:
    0 0 0 3px
    rgba(255,122,0,.10);
}

.login-button{
  width:100%;
  height:53px;

  border:0;

  border-radius:15px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #ff8a00,
      #ff6200
    );

  font-weight:800;

  font-size:15px;

  margin-top:5px;
}

.login-button:disabled{
  opacity:.6;

  cursor:not-allowed;
}

.login-error{
  margin-top:15px;

  padding:12px 14px;

  border-radius:12px;

  background:rgba(255,50,50,.10);

  border:1px solid
    rgba(255,80,80,.20);

  color:#ffb0b0;

  font-size:13px;

  line-height:1.5;
}

.login-info{
  margin-top:18px;

  text-align:center;

  color:#707078;

  font-size:12px;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
  position:sticky;

  top:0;

  z-index:50;

  height:72px;

  background:
    rgba(5,5,6,.90);

  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--line);
}

.nav-inner{
  width:min(1180px,calc(100% - 32px));

  height:100%;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;
}

.brand{
  display:flex;

  align-items:center;

  gap:11px;

  font-weight:900;

  letter-spacing:.5px;
}

.brand-icon{
  width:38px;
  height:38px;

  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      #ff9b2b,
      #ff6100
    );

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  font-size:23px;

  font-weight:900;

  font-style:italic;
}

.brand-text span{
  color:var(--orange);
}

.nav-right{
  display:flex;

  align-items:center;

  gap:12px;
}

.user-chip{
  display:flex;

  align-items:center;

  gap:9px;

  background:#111216;

  border:1px solid var(--line);

  border-radius:30px;

  padding:7px 12px 7px 7px;
}

.user-avatar{
  width:31px;
  height:31px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #ff9d2e,
      #ff5d00
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-weight:800;

  font-size:13px;
}

.user-email{
  max-width:180px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  font-size:12px;

  color:#ddd;
}

.logout-btn{
  height:39px;

  padding:0 14px;

  border:1px solid
    rgba(255,122,0,.35);

  border-radius:11px;

  color:#fff;

  background:
    rgba(255,122,0,.08);

  font-weight:700;

  font-size:12px;
}


/* =====================================================
   HERO
===================================================== */

.hero{
  position:relative;

  overflow:hidden;

  padding:70px 0 55px;

  border-bottom:1px solid var(--line);

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(255,122,0,.08),
      transparent 30%
    );
}

.hero-inner{
  position:relative;

  z-index:2;
}

.hero-kicker{
  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:7px 12px;

  border-radius:30px;

  background:
    rgba(255,122,0,.09);

  border:1px solid
    rgba(255,122,0,.20);

  color:#ffb15b;

  font-size:12px;

  font-weight:700;

  margin-bottom:18px;
}

.live-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#42dc9b;

  box-shadow:
    0 0 10px #42dc9b;
}

.hero h1{
  font-size:
    clamp(34px,5vw,60px);

  line-height:1.02;

  font-weight:950;

  letter-spacing:-2px;

  max-width:760px;
}

.hero h1 span{
  color:var(--orange);
}

.hero-text{
  max-width:650px;

  margin-top:17px;

  color:#a9a9b1;

  line-height:1.7;

  font-size:15px;
}

.hero-bottom{
  display:flex;

  align-items:center;

  gap:12px;

  margin-top:28px;

  flex-wrap:wrap;
}

.stat-box{
  padding:12px 17px;

  border-radius:14px;

  background:#111216;

  border:1px solid var(--line);
}

.stat-number{
  color:var(--orange);

  font-size:21px;

  font-weight:900;
}

.stat-label{
  color:#888891;

  font-size:11px;

  margin-top:2px;
}


/* =====================================================
   HUB
===================================================== */

.hub{
  padding:42px 0 80px;
}

.hub-header{
  margin-bottom:24px;
}

.hub-title-row{
  display:flex;

  align-items:center;

  gap:13px;
}

.cap-icon{
  width:48px;
  height:48px;

  border-radius:14px;

  background:
    rgba(255,122,0,.10);

  border:1px solid
    rgba(255,122,0,.20);

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:25px;
}

.hub-title{
  font-size:26px;

  font-weight:900;
}

.hub-subtitle{
  color:#777780;

  font-size:13px;

  margin-top:4px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-wrap{
  margin-bottom:27px;

  position:relative;
}

.search-wrap .search-icon{
  position:absolute;

  left:17px;
  top:50%;

  transform:translateY(-50%);

  color:#777;

  font-size:19px;
}

.search-input{
  width:100%;

  height:55px;

  border-radius:15px;

  border:1px solid var(--line);

  background:#0d0e11;

  color:#fff;

  outline:none;

  padding:0 20px 0 48px;

  font-size:14px;
}

.search-input:focus{
  border-color:
    rgba(255,122,0,.5);
}


/* =====================================================
   MODULE GRID
===================================================== */

.modules{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:20px;
}


/* =====================================================
   MODULE CARD
===================================================== */

.module-card{
  background:#101114;

  border:1px solid var(--line);

  border-radius:19px;

  overflow:hidden;

  transition:.25s ease;
}

.module-card:hover{
  transform:translateY(-5px);

  border-color:
    rgba(255,122,0,.35);

  box-shadow:
    0 18px 50px rgba(0,0,0,.35);
}

.module-thumb{
  height:185px;

  position:relative;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 75% 20%,
      rgba(255,157,46,.38),
      transparent 22%
    ),
    radial-gradient(
      circle at 20% 75%,
      rgba(255,93,0,.25),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #191a1f,
      #08090b
    );
}

.module-thumb::before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      125deg,
      transparent 20%,
      rgba(255,255,255,.04) 20.5%,
      transparent 21%
    );
}

.thumb-glow{
  position:absolute;

  width:170px;
  height:170px;

  border-radius:50%;

  background:
    rgba(255,122,0,.16);

  filter:blur(40px);

  right:-40px;
  bottom:-70px;
}

.module-number{
  position:absolute;

  top:14px;
  left:14px;

  z-index:3;

  padding:7px 10px;

  border-radius:9px;

  background:
    rgba(5,5,5,.72);

  border:1px solid
    rgba(255,122,0,.35);

  color:#ffad4d;

  font-size:10px;

  font-weight:900;
}

.module-category{
  position:absolute;

  top:14px;
  right:14px;

  z-index:3;

  padding:7px 9px;

  border-radius:9px;

  background:
    rgba(255,255,255,.08);

  color:#ddd;

  font-size:9px;

  font-weight:800;
}

.module-symbol{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  font-size:66px;

  z-index:2;
}

.module-body{
  padding:18px;
}

.module-name{
  font-size:18px;

  line-height:1.25;

  font-weight:850;

  margin-bottom:8px;
}

.module-description{
  color:#888891;

  font-size:12px;

  line-height:1.6;

  min-height:39px;
}

.module-footer{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-top:17px;
}

.module-status{
  color:#777780;

  font-size:10px;

  display:flex;

  align-items:center;

  gap:6px;
}

.module-status::before{
  content:"";

  width:6px;
  height:6px;

  border-radius:50%;

  background:#38d996;

  box-shadow:
    0 0 8px
    rgba(56,217,150,.5);
}

.open-module{
  border:0;

  background:
    linear-gradient(
      135deg,
      #ff8b00,
      #ff6200
    );

  color:#fff;

  border-radius:10px;

  padding:10px 14px;

  font-size:11px;

  font-weight:850;
}


/* =====================================================
   MANTRA FOTO THUMBNAIL
===================================================== */

.mantra-thumb{
  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(255,122,0,.35),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(255,174,50,.28),
      transparent 20%
    ),
    linear-gradient(
      135deg,
      #160b03,
      #050505 65%
    );
}

.mantra-logo{
  width:94px;
  height:94px;

  border-radius:26px;

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #dedede
    );

  box-shadow:
    0 12px 35px
    rgba(255,122,0,.30),

    inset
    0 0 0 4px
    #ff8a00;

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:3;
}

.mantra-camera{
  width:57px;
  height:44px;

  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      #ff8a00,
      #ff5d00
    );

  position:relative;
}

.mantra-camera::before{
  content:"";

  position:absolute;

  width:25px;
  height:25px;

  border-radius:50%;

  background:#171717;

  border:4px solid #fff;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);
}

.mantra-camera::after{
  content:"";

  position:absolute;

  width:19px;
  height:6px;

  border-radius:5px;

  background:#ff7a00;

  top:-6px;
  left:10px;
}

.mantra-orbit{
  position:absolute;

  width:122px;
  height:53px;

  border:5px solid #ff7600;

  border-left-color:transparent;

  border-right-color:transparent;

  border-radius:50%;

  transform:rotate(-20deg);

  left:50%;
  top:50%;

  translate:-50% -50%;

  z-index:4;

  pointer-events:none;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  grid-column:1/-1;

  padding:60px 20px;

  text-align:center;

  border:1px dashed
    rgba(255,255,255,.12);

  border-radius:18px;

  color:#777;
}

.empty strong{
  display:block;

  color:#fff;

  margin-bottom:7px;
}


/* =====================================================
   MANTRA PAGE
===================================================== */

#mantraPage{
  min-height:calc(100vh - 72px);

  padding:35px 0 70px;

  background:
    radial-gradient(
      circle at 85% 5%,
      rgba(255,122,0,.09),
      transparent 30%
    );
}

.back-button{
  border:1px solid var(--line);

  background:#111216;

  color:#fff;

  border-radius:11px;

  padding:10px 15px;

  font-size:12px;

  font-weight:800;

  margin-bottom:25px;
}

.mantra-heading{
  margin-bottom:27px;
}

.mantra-heading .eyebrow{
  color:var(--orange);

  font-size:11px;

  font-weight:900;

  letter-spacing:1px;

  margin-bottom:8px;
}

.mantra-heading h1{
  font-size:
    clamp(30px,5vw,48px);

  font-weight:950;

  letter-spacing:-1.5px;
}

.mantra-heading p{
  color:#8e8e96;

  margin-top:10px;

  font-size:14px;

  line-height:1.6;

  max-width:650px;
}

.mantra-layout{
  display:grid;

  grid-template-columns:
    1.1fr .9fr;

  gap:22px;

  align-items:start;
}


/* =====================================================
   TOOL PANEL
===================================================== */

.tool-panel{
  background:#101114;

  border:1px solid var(--line);

  border-radius:20px;

  padding:22px;
}

.tool-panel h2{
  font-size:18px;

  margin-bottom:18px;
}


/* =====================================================
   UPLOAD
===================================================== */

.upload-area{
  position:relative;

  min-height:230px;

  border:1px dashed
    rgba(255,122,0,.40);

  border-radius:16px;

  background:
    rgba(255,122,0,.035);

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  overflow:hidden;
}

.upload-area.has-image{
  border-style:solid;
}

.upload-content{
  padding:25px;
}

.upload-icon{
  font-size:48px;

  margin-bottom:10px;
}

.upload-title{
  font-size:15px;

  font-weight:850;

  margin-bottom:6px;
}

.upload-subtitle{
  color:#777780;

  font-size:11px;

  line-height:1.5;

  margin-bottom:15px;
}

.upload-button{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:10px 16px;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #ff8b00,
      #ff6200
    );

  color:#fff;

  font-size:11px;

  font-weight:850;

  cursor:pointer;
}

#photoInput{
  display:none;
}

.upload-preview{
  display:none;

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  background:#080808;
}

.upload-area.has-image
.upload-preview{
  display:block;
}

.upload-area.has-image
.upload-content{
  display:none;
}

.remove-photo{
  display:none;

  position:absolute;

  top:12px;
  right:12px;

  z-index:5;

  width:34px;
  height:34px;

  border-radius:50%;

  border:1px solid
    rgba(255,255,255,.15);

  background:
    rgba(0,0,0,.65);

  color:#fff;

  font-size:18px;
}

.upload-area.has-image
.remove-photo{
  display:block;
}


/* =====================================================
   FORM OPTIONS
===================================================== */

.option-group{
  margin-top:20px;
}

.option-label{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:10px;

  font-size:12px;

  font-weight:800;
}

.option-label span{
  color:#777780;

  font-size:10px;

  font-weight:500;
}

.option-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:9px;
}

.option-btn{
  min-height:43px;

  border-radius:11px;

  border:1px solid var(--line);

  background:#0b0c0f;

  color:#c9c9ce;

  font-size:11px;

  font-weight:700;

  padding:8px;

  transition:.2s;
}

.option-btn:hover{
  border-color:
    rgba(255,122,0,.35);
}

.option-btn.active{
  color:#fff;

  border-color:
    var(--orange);

  background:
    rgba(255,122,0,.10);

  box-shadow:
    inset
    0 0 0 1px
    rgba(255,122,0,.12);
}


/* =====================================================
   SELECT
===================================================== */

.select-control{
  width:100%;

  height:45px;

  border-radius:11px;

  border:1px solid var(--line);

  background:#0b0c0f;

  color:#fff;

  padding:0 12px;

  outline:none;
}

.select-control:focus{
  border-color:var(--orange);
}


/* =====================================================
   RANGE
===================================================== */

.range-row{
  display:flex;

  align-items:center;

  gap:12px;
}

.range{
  flex:1;

  accent-color:var(--orange);
}

.range-value{
  min-width:35px;

  text-align:center;

  padding:6px 8px;

  border-radius:8px;

  background:#0b0c0f;

  color:var(--orange);

  font-size:11px;

  font-weight:900;
}


/* =====================================================
   GENERATE
===================================================== */

.generate-button{
  width:100%;

  height:54px;

  margin-top:23px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #ff9500,
      #ff5d00
    );

  color:#fff;

  font-size:14px;

  font-weight:900;

  box-shadow:
    0 12px 28px
    rgba(255,122,0,.17);

  transition:.2s;
}

.generate-button:hover{
  transform:translateY(-1px);
}

.generate-button:disabled{
  opacity:.55;

  cursor:not-allowed;

  transform:none;
}


/* =====================================================
   PREVIEW PANEL
===================================================== */

.preview-panel{
  background:#101114;

  border:1px solid var(--line);

  border-radius:20px;

  padding:22px;

  position:sticky;

  top:95px;
}

.preview-panel h2{
  font-size:18px;

  margin-bottom:15px;
}

.preview-box{
  min-height:380px;

  border-radius:16px;

  border:1px dashed
    rgba(255,255,255,.10);

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,122,0,.08),
      transparent 30%
    ),
    #090a0c;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  overflow:hidden;

  position:relative;
}

.preview-placeholder{
  padding:25px;

  color:#67676f;

  font-size:12px;

  line-height:1.6;
}

.preview-placeholder .big{
  display:block;

  font-size:55px;

  margin-bottom:10px;

  opacity:.7;
}

#resultPreview{
  display:none;

  width:100%;
  height:100%;

  min-height:380px;

  object-fit:contain;
}

.preview-box.generated
#resultPreview{
  display:block;
}

.preview-box.generated
.preview-placeholder{
  display:none;
}


/* =====================================================
   PROMPT
===================================================== */

.prompt-box{
  margin-top:16px;

  padding:14px;

  border-radius:13px;

  background:#090a0c;

  border:1px solid var(--line);
}

.prompt-title{
  font-size:10px;

  color:var(--orange);

  font-weight:900;

  letter-spacing:.7px;

  margin-bottom:7px;
}

#generatedPrompt{
  color:#888891;

  font-size:11px;

  line-height:1.6;
}

.copy-prompt{
  width:100%;

  height:39px;

  margin-top:10px;

  border-radius:9px;

  border:1px solid
    rgba(255,122,0,.25);

  background:
    rgba(255,122,0,.07);

  color:#ffac4d;

  font-size:10px;

  font-weight:800;
}


/* =====================================================
   INFO BOX
===================================================== */

.info-box{
  margin-top:15px;

  padding:14px;

  border-radius:13px;

  background:
    rgba(255,122,0,.045);

  border:1px solid
    rgba(255,122,0,.13);

  color:#85858d;

  font-size:10px;

  line-height:1.6;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
  padding:25px 0 35px;

  border-top:1px solid var(--line);

  text-align:center;

  color:#55555d;

  font-size:11px;
}

.footer span{
  color:var(--orange);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:950px){

  .modules{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .mantra-layout{
    grid-template-columns:1fr;
  }

  .preview-panel{
    position:relative;

    top:auto;
  }

}

@media(max-width:650px){

  .container,
  .nav-inner{
    width:calc(100% - 22px);
  }

  .navbar{
    height:64px;
  }

  .user-email{
    display:none;
  }

  .hero{
    padding:50px 0 40px;
  }

  .hero h1{
    font-size:38px;

    letter-spacing:-1.5px;
  }

  .hero-text{
    font-size:13px;
  }

  .hub{
    padding:32px 0 55px;
  }

  .hub-title{
    font-size:21px;
  }

  .modules{
    grid-template-columns:1fr;

    gap:15px;
  }

  .module-thumb{
    height:195px;
  }

  .login-box{
    padding:28px 21px 23px;

    border-radius:22px;
  }

  #mantraPage{
    padding-top:25px;
  }

  .tool-panel,
  .preview-panel{
    padding:16px;
  }

  .preview-box,
  #resultPreview{
    min-height:300px;
  }

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-track{
  background:#050505;
}

::-webkit-scrollbar-thumb{
  background:#29292e;

  border-radius:20px;
}

</style>
