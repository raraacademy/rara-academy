<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RARA Academy - Dashboard Member Area</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RARA ACADEMY
   DARK / WHITE / ORANGE
========================================================= */

:root {
  --bg: #050505;
  --bg-soft: #09090b;
  --header: #111114;
  --card: #121216;
  --card-soft: #18181d;

  --white: #ffffff;
  --text: #f5f5f5;
  --muted: #9999a1;

  --orange: #ff7417;
  --orange-light: #ff9a2f;
  --orange-dark: #c94f00;

  --border: #303038;
  --border-soft: #24242a;

  --danger: #ff5050;
  --success: #55d982;
}

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(255,116,23,.07),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 70%,
      rgba(255,116,23,.05),
      transparent 30%
    ),
    #050505;

  color: var(--text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  overflow-x: hidden;
}

/* =========================================================
   BACKGROUND NETWORK EFFECT
========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;

  opacity: .22;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.5) 1px,
      transparent 1px
    ),
    linear-gradient(
      35deg,
      transparent 49.5%,
      rgba(255,255,255,.08) 50%,
      transparent 50.5%
    ),
    linear-gradient(
      145deg,
      transparent 49.5%,
      rgba(255,255,255,.06) 50%,
      transparent 50.5%
    );

  background-size:
    170px 170px,
    260px 260px,
    300px 300px;
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 430px;

  background:
    linear-gradient(
      145deg,
      rgba(24,24,29,.98),
      rgba(10,10,12,.98)
    );

  border: 1px solid #36363e;

  border-radius: 22px;

  padding: 38px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.65),
    0 0 50px rgba(255,116,23,.04);
}

.login-logo {
  text-align: center;
  margin-bottom: 30px;
}

.logo-mark {
  width: 65px;
  height: 65px;

  margin: 0 auto 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      var(--orange),
      var(--orange-light)
    );

  color: #080808;

  font-size: 21px;
  font-weight: 1000;

  box-shadow:
    0 12px 35px rgba(255,116,23,.18);
}

.login-logo h1 {
  color: white;

  font-size: 29px;
  font-weight: 900;

  letter-spacing: -1px;
}

.login-logo h1 span {
  color: var(--orange);
}

.login-logo p {
  color: var(--muted);

  font-size: 14px;

  margin-top: 9px;

  line-height: 1.5;
}

/* =========================================================
   FORM
========================================================= */

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;

  color: white;

  font-size: 14px;
  font-weight: 700;

  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  height: 52px;

  padding: 0 15px;

  background: #0d0d10;

  color: white;

  border: 1px solid #3a3a42;

  border-radius: 11px;

  outline: none;

  font-size: 15px;

  transition: .2s;
}

.form-group input::placeholder {
  color: #686870;
}

.form-group input:focus {
  border-color: var(--orange);

  box-shadow:
    0 0 0 3px rgba(255,116,23,.10);
}

/* =========================================================
   LOGIN OPTIONS
========================================================= */

.login-options {
  margin: 4px 0 20px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  font-size: 13px;

  color: #aaaab1;
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
}

.remember input {
  accent-color: var(--orange);
}

/* =========================================================
   LOGIN BUTTON
========================================================= */

.primary {
  width: 100%;
  height: 52px;

  border: 0;

  border-radius: 11px;

  background:
    linear-gradient(
      135deg,
      var(--orange),
      var(--orange-light)
    );

  color: #080808;

  font-size: 15px;
  font-weight: 900;

  cursor: pointer;

  transition: .2s;
}

.primary:hover {
  transform: translateY(-1px);

  box-shadow:
    0 12px 30px rgba(255,116,23,.18);
}

.primary:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/* =========================================================
   AUTH MESSAGE
========================================================= */

.message {
  min-height: 22px;

  margin-top: 14px;

  text-align: center;

  font-size: 13px;

  color: var(--danger);
}

/* =========================================================
   APP
========================================================= */

#app {
  display: none;

  min-height: 100vh;
}

/* =========================================================
   NAVBAR
========================================================= */

.navbar {
  height: 76px;

  padding: 0 42px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    rgba(13,13,16,.95);

  border-bottom: 1px solid #26262c;

  position: sticky;
  top: 0;

  z-index: 100;

  backdrop-filter: blur(16px);
}

/* =========================================================
   BRAND
========================================================= */

.navbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 22px;
  font-weight: 900;
}

.brand-icon {
  width: 35px;
  height: 35px;

  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--orange);

  color: #080808;

  font-size: 13px;
  font-weight: 1000;
}

.brand-rara {
  color: white;
}

.brand-academy {
  color: var(--orange);
}

/* =========================================================
   MEMBER
========================================================= */

.member-area {
  display: flex;
  align-items: center;
  gap: 13px;
}

.member-info {
  text-align: right;
}

.member-name {
  color: white;

  font-size: 14px;
  font-weight: 800;
}

.member-label {
  color: #717179;

  font-size: 11px;

  margin-top: 3px;
}

.avatar {
  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #29292f,
      #111114
    );

  border: 2px solid var(--orange);

  color: var(--orange);

  font-size: 15px;
  font-weight: 900;
}

/* =========================================================
   LOGOUT
========================================================= */

.logout {
  height: 38px;

  padding: 0 14px;

  border-radius: 9px;

  background: #151519;

  border: 1px solid #393940;

  color: #ddd;

  font-size: 12px;
  font-weight: 700;

  cursor: pointer;

  transition: .2s;
}

.logout:hover {
  color: var(--orange);
  border-color: var(--orange);
}

/* =========================================================
   ORANGE LINE
========================================================= */

.orange-line {
  height: 2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--orange),
      var(--orange-light),
      transparent
    );

  opacity: .9;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {
  width: min(1450px, 94%);

  margin: 0 auto;

  padding:
    40px
    0
    80px;
}

/* =========================================================
   HERO
========================================================= */

.hero {
  padding: 10px 10px 28px;
}

.hero-small {
  color: var(--orange);

  font-size: 12px;

  font-weight: 900;

  letter-spacing: 2px;

  margin-bottom: 10px;
}

.hero h2 {
  font-size: 39px;

  font-weight: 900;

  letter-spacing: -1.5px;

  line-height: 1.1;
}

.hero h2 span {
  color: var(--orange);
}

.hero p {
  max-width: 700px;

  margin-top: 12px;

  color: var(--muted);

  font-size: 14px;

  line-height: 1.6;
}

.hero-count {
  display: inline-flex;

  margin-top: 19px;

  padding: 8px 13px;

  background: #121216;

  border: 1px solid #37373f;

  border-radius: 8px;

  color: var(--orange-light);

  font-size: 12px;

  font-weight: 800;
}

/* =========================================================
   SEARCH
========================================================= */

.toolbar {
  margin: 4px 0 24px;
}

.search {
  width: 100%;
  height: 51px;

  background: #101014;

  border: 1px solid #35353d;

  border-radius: 12px;

  padding: 0 17px;

  color: white;

  font-size: 14px;

  outline: none;

  transition: .2s;
}

.search::placeholder {
  color: #696971;
}

.search:focus {
  border-color: var(--orange);

  box-shadow:
    0 0 0 3px rgba(255,116,23,.08);
}

/* =========================================================
   STATUS
========================================================= */

.status {
  margin-bottom: 16px;

  color: #707078;

  font-size: 12px;
}

.status.success {
  color: var(--success);
}

.status.error {
  color: #ff7575;
}

/* =========================================================
   SECTION
========================================================= */

.section-title {
  margin-bottom: 19px;

  font-size: 23px;

  font-weight: 900;

  color: white;
}

/* =========================================================
   MODULE GRID
========================================================= */

.modules {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 28px;
}

/* =========================================================
   MODULE CARD
========================================================= */

.module-card {
  overflow: hidden;

  position: relative;

  min-width: 0;

  background:
    linear-gradient(
      145deg,
      #17171b,
      #0e0e11
    );

  border:
    1px solid #3a3a42;

  border-radius: 17px;

  cursor: pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    box-shadow .22s ease;

  animation:
    cardIn .45s ease both;
}

.module-card:hover {
  transform: translateY(-5px);

  border-color: var(--orange);

  box-shadow:
    0 18px 45px rgba(0,0,0,.55),
    0 0 20px rgba(255,116,23,.08);
}

/* =========================================================
   MODULE IMAGE
========================================================= */

.module-image {
  height: 205px;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 30% 30%,
      rgba(255,116,23,.25),
      transparent 28%
    ),
    radial-gradient(
      circle at 75% 75%,
      rgba(255,154,47,.10),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #303039,
      #0c0c0f
    );
}

.module-image::after {
  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05),
      rgba(0,0,0,.25)
    );

  pointer-events: none;
}

.module-image.real-image {
  background-size: cover;
  background-position: center;
}

/* =========================================================
   MODULE NUMBER
========================================================= */

.module-number {
  position: absolute;

  top: 15px;
  left: 15px;

  z-index: 5;

  padding: 8px 11px;

  border-radius: 8px;

  background:
    rgba(20,20,24,.94);

  border:
    1px solid rgba(255,116,23,.35);

  color: var(--orange);

  font-size: 11px;

  font-weight: 900;

  letter-spacing: .6px;

  box-shadow:
    0 5px 15px rgba(0,0,0,.25);
}

/* =========================================================
   PLACEHOLDER
========================================================= */

.module-image-text {
  position: relative;

  z-index: 2;

  padding: 25px;

  text-align: center;

  color: white;

  font-size: 22px;

  line-height: 1.25;

  font-weight: 900;

  text-shadow:
    0 3px 15px black;
}

/* =========================================================
   MODULE CONTENT
========================================================= */

.module-content {
  min-height: 104px;

  padding: 19px 19px 21px;

  background:
    linear-gradient(
      145deg,
      #17171b,
      #101013
    );
}

.module-title {
  color: white;

  font-size: 17px;

  line-height: 1.35;

  font-weight: 900;
}

.module-open {
  display: inline-block;

  margin-top: 11px;

  color: var(--orange);

  font-size: 11px;

  font-weight: 800;
}

/* =========================================================
   EMPTY
========================================================= */

.empty {
  display: none;

  padding: 55px 20px;

  text-align: center;

  color: #888890;

  border: 1px dashed #3a3a40;

  border-radius: 15px;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
  padding: 60px 20px;

  text-align: center;

  color: #777780;
}

/* =========================================================
   ANIMATION
========================================================= */

@keyframes cardIn {

  from {
    opacity: 0;
    transform: translateY(12px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1050px) {

  .modules {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .navbar {
    padding: 0 22px;
  }

  .container {
    width: 92%;
  }

}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

  .navbar {
    height: 67px;

    padding: 0 15px;
  }

  .navbar-brand {
    font-size: 17px;
  }

  .brand-icon {
    width: 30px;
    height: 30px;

    border-radius: 8px;

    font-size: 11px;
  }

  .member-info {
    display: none;
  }

  .avatar {
    width: 35px;
    height: 35px;
  }

  .logout {
    height: 34px;

    padding: 0 10px;
  }

  .container {
    width: 92%;

    padding-top: 28px;
  }

  .hero {
    padding: 0 3px 23px;
  }

  .hero
